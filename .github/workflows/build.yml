name: Build

on:
  push:
    branches:
      - develop
      - "[0-9]*.x"
  pull_request:
    branches:
      - develop
      - "[0-9]*.x"
  workflow_dispatch:

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    outputs:
      php: ${{ steps.php.outputs.versions }}
      lowest: ${{ steps.php.outputs.lowest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every Laravel line declares its PHP range as ">=8.A <8.B" in
      # composer.json, so the same workflow works on every N.x line.
      - name: Read the supported PHP minors
        id: php
        shell: bash
        run: |
          constraint="$(jq -r '.require.php' composer.json)"

          if [[ ! "$constraint" =~ ^\>=8\.([0-9]+)\ \<8\.([0-9]+)$ ]]; then
            echo "require.php must read \">=8.A <8.B\", got: $constraint" >&2
            exit 1
          fi

          versions="$(seq "${BASH_REMATCH[1]}" $((BASH_REMATCH[2] - 1)) | sed 's/^/8./' | jq -Rnc '[inputs]')"

          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "lowest=8.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependencies }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        dependencies:
          - lowest
          - highest
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    # Real servers for the integration tests (service containers run on Linux only;
    # Windows runs them against SQLite and skips the rest).
    services:
      mysql:
        image: ${{ matrix.os == 'ubuntu-latest' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: idempotency
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: idempotency
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: ${{ matrix.os == 'ubuntu-latest' && 'redis:7' || '' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      IDEMPOTENCY_TEST_MYSQL: ${{ matrix.os == 'ubuntu-latest' && '{"host":"127.0.0.1","port":3306,"username":"root","password":"secret","database":"idempotency"}' || '' }}
      IDEMPOTENCY_TEST_PGSQL: ${{ matrix.os == 'ubuntu-latest' && '{"host":"127.0.0.1","port":5432,"username":"postgres","password":"secret","database":"idempotency"}' || '' }}
      IDEMPOTENCY_TEST_REDIS_HOST: ${{ matrix.os == 'ubuntu-latest' && '127.0.0.1:6379' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Pint and PHPStan run once, on the lowest PHP with the highest
      # dependencies: a newer PHP installs a newer Pint with extra rules.
      - name: Check
        if: matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest'
        run: composer check

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest') }}
        run: composer test
